<section class="wt-temoignage" id="wt-temoignage-anne-claire" aria-label="Témoignage de Anne-Claire">
  <style>
    #wt-temoignage-anne-claire {
      --wt-blue-2: #002882; --wt-blue-3: #2a4cff; --wt-ghost: #f2f4ff; --wt-border: #eff0f6;
      font-family: "Work Sans v2", Arial, sans-serif;
      margin: 0 0 3rem; /* bloc avec bande de fond pleine largeur : margin-bottom seul */
      box-sizing: border-box;
    }
    #wt-temoignage-anne-claire *, #wt-temoignage-anne-claire *::before, #wt-temoignage-anne-claire *::after { box-sizing: border-box; }
    /* Bande pleine largeur (technique des marges négatives, jamais clip-path ni box-shadow géant). Elle prolonge la bande du bloc
       qui précède : ce bloc doit suivre directement celui dont il a été séparé. */
    #wt-temoignage-anne-claire .wtt-band { position: relative; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw; width: 100vw; background: var(--wt-ghost); padding: 2.75rem 0 5rem; }
    #wt-temoignage-anne-claire .wtt-inner { max-width: 71.25rem; margin: 0 auto; padding: 0 1rem; box-sizing: border-box; }
    /* Carte de témoignage : photo qui déborde en haut (cadre transparent aux proportions de la photo, centré sur le bord de la carte),
       guillemets en icônes SVG du site, texte et signature centrés (nom en gras, fonction en poids normal). */
    #wt-temoignage-anne-claire .wtt-testimonial { position: relative; margin: 0 auto; max-width: 40rem; padding-top: 4.21875rem; }
    #wt-temoignage-anne-claire .wtt-card { position: relative; background: #fff; border: 1px solid var(--wt-border); border-radius: 0; padding: 5rem 1.75rem 2rem; text-align: center; box-shadow: rgba(4,17,112,0.1) 0px 0px 30px 10px; }
    #wt-temoignage-anne-claire .wtt-photo { position: absolute; top: -4.21875rem; left: 50%; transform: translateX(-50%); width: 7.5rem; height: 8.4375rem; background: transparent; display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 1; }
    #wt-temoignage-anne-claire .wtt-photo img { width: 100%; height: 100%; object-fit: fill; display: block; }
    #wt-temoignage-anne-claire .wtt-quote-icon { position: absolute; width: 2.5rem; }
    #wt-temoignage-anne-claire .wtt-quote-icon-tl { top: -1.25rem; left: -0.75rem; }
    #wt-temoignage-anne-claire .wtt-quote-icon-br { bottom: -1.25rem; right: -0.625rem; }
    #wt-temoignage-anne-claire .wtt-text { color: var(--wt-blue-2); font-size: 1rem; font-weight: 500; line-height: 1.7; text-align: center; margin: 0 0 1rem; }
    #wt-temoignage-anne-claire .wtt-author { color: var(--wt-blue-3); font-size: 1rem; font-weight: 400; text-align: center; margin: 0; }
    #wt-temoignage-anne-claire .wtt-name { font-weight: 600; }
    @media screen and (max-width: 767px) { #wt-temoignage-anne-claire .wtt-card { padding: 5.5rem 1.25rem 1.5rem; } }
  </style>

  <div class="wtt-band">
  <div class="wtt-inner">

  <div class="wtt-testimonial">
    <div class="wtt-card">
      <div class="wtt-photo" data-person="anne-claire">
        <img src="https://cdn.prod.website-files.com/63d687e3cca00b36190024ea/6a8c05d73b86dda0c4334ef0_anne-claire.webp" alt="Anne-Claire, Consultante Product Confirmée" loading="lazy">
      </div>
      <img class="wtt-quote-icon wtt-quote-icon-tl" src="https://cdn.prod.website-files.com/63d687e3cca00b36190024ea/63d6a06f6b5cd13d0c86e4a7_quotes-1.svg" alt="">
      <img class="wtt-quote-icon wtt-quote-icon-br" src="https://cdn.prod.website-files.com/63d687e3cca00b36190024ea/63d6a06fcc3c397e769ef781_quotes.svg" alt="">
      <p class="wtt-text">Ce qui est fou chez WeFiiT c'est qu'on se connait tous mais au final on se rend compte qu'on a des talents cachés</p>
      <p class="wtt-author"><strong class="wtt-name">Anne-Claire</strong> | Consultante Product Confirmée</p>
    </div>
  </div>

  </div>
  </div>
</section>
