<section id="wt-2025" aria-labelledby="wt-2025-title">
  <style>
    #wt-2025 {
      --wt-blue: #001d84;
      --wt-blue-2: #002882;
      --wt-blue-3: #2a4cff;
      --wt-orange: #f98f03;
      font-family: "Work Sans v2", Arial, sans-serif;
      max-width: 71.25rem;
      margin: 0 auto 5rem;
      padding: 0 1rem;
      box-sizing: border-box;
    }
    #wt-2025 *, #wt-2025 *::before, #wt-2025 *::after { box-sizing: border-box; }

    /* Titre : même traitement que les autres titres du site (dégradé bleu
       horizontal 270deg + point final). Ici le point est mesuré comme une
       couleur pleine (--wt-orange), pas le dégradé bicolore orange vertical
       utilisé sur d'autres titres du projet — vérifié directement sur le bloc
       réel ("WeFiiT en 2025 c'était ça.", page équipe en prod). Centré à
       toutes les tailles (demande explicite de Paul) : le site réel aligne ce
       titre à gauche sur mobile, mais ce n'est pas ce qui est voulu ici. */
    #wt-2025 .wt-title {
      font-family: Allroundgothic, Arial, sans-serif;
      font-size: 3.2rem;
      line-height: 3.84rem;
      font-weight: 400;
      letter-spacing: -0.128rem;
      text-align: center;
      margin: 0;
      background: linear-gradient(270deg, var(--wt-blue-2), var(--wt-blue-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    #wt-2025 .wt-title-dot { color: var(--wt-orange); }
    @media screen and (max-width: 767px) {
      #wt-2025 .wt-title { font-size: 2.25rem; line-height: 2.6rem; letter-spacing: -0.06rem; }
    }

    /* Vidéo : iframe YouTube native (pas -nocookie ici, comme le bloc réel),
       pleine largeur du bloc et donc centrée avec lui. Ratio de padding-top
       repris tel quel de la vidéo réelle (56.17021276595745%, mesuré sur la
       page équipe en prod — ce n'est pas un 16:9 propre). Écart titre→vidéo
       de 1rem, mesuré sur le bloc réel (16px). */
    #wt-2025 .wt-video-frame {
      position: relative;
      width: 100%;
      margin-top: 1rem;
      padding-top: 56.17021276595745%;
      overflow: hidden;
    }
    #wt-2025 .wt-video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>

  <h2 class="wt-title" id="wt-2025-title">WeFiiT en 2025 c'était ça<span class="wt-title-dot">.</span></h2>

  <div class="wt-video-frame">
    <iframe src="https://www.youtube.com/embed/PqlMplRXqpo?rel=0&amp;controls=1&amp;autoplay=0&amp;mute=0&amp;start=0" title="Nos rituels chez WeFiiT - Retour sur 2025 et cap sur 2026 ! ⛷️" loading="lazy" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
</section>
