<section id="wt-2025" aria-labelledby="wt-2025-title">
  <style>
    #wt-2025 {
      --wt-blue: #001d84;
      --wt-blue-2: #002882;
      --wt-blue-3: #2a4cff;
      --wt-orange: #f98f03;
      --wt-orange-2: #e95400;
      font-family: "Work Sans v2", Arial, sans-serif;
      max-width: 71.25rem;
      margin: 0 auto 5rem;
      padding: 0 1rem;
      box-sizing: border-box;
    }
    #wt-2025 *, #wt-2025 *::before, #wt-2025 *::after { box-sizing: border-box; }

    /* Titre : même traitement que les autres titres du site (dégradé bleu
       horizontal 270deg + point final en dégradé orange vertical). Ancienne remarque : le point était mesuré comme une
       couleur pleine (--wt-orange) sur le site en prod ; la charte prévoit le dégradé bicolore orange vertical
       utilisé sur les autres titres du projet, adopté ici — vérifié sur le bloc
       réel ("WeFiiT en 2025 c'était ça.", page équipe en prod, remplacé par « WeFiiT, c’est aussi ça. »). Centré à
       toutes les tailles (demande explicite du client) : le site réel aligne ce
       titre à gauche sur mobile, mais ce n'est pas ce qui est voulu ici. */
    #wt-2025 .wt-title {
      font-family: Allroundgothic, Arial, sans-serif;
      font-size: 3.2rem;
      line-height: 3.84rem;
      font-weight: 400;
      letter-spacing: -0.128rem;
      text-align: center;
      margin: 0;
      background: linear-gradient(270deg, var(--wt-blue-2), var(--wt-blue-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    /* Point final : dégradé orange vertical, dans son propre span (charte, comme les autres titres). Avec une simple
       `color`, le point héritait du remplissage transparent du titre et prenait le dégradé bleu. */
    #wt-2025 .wt-title-dot {
      background: linear-gradient(var(--wt-orange-2), var(--wt-orange));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    @media screen and (max-width: 767px) {
      #wt-2025 .wt-title { font-size: 3rem; line-height: 1; letter-spacing: -0.12rem; } /* design-system.md §2 : 3rem entre 480 et 767px, 2.5rem sous 480px (règle en bas de feuille) */
    }

    /* Vidéo : iframe YouTube native (pas -nocookie ici, comme le bloc réel),
       pleine largeur du bloc et donc centrée avec lui. Ratio de padding-top
       repris tel quel de la vidéo réelle (56.17021276595745%, mesuré sur la
       page équipe en prod — ce n'est pas un 16:9 propre). Écart titre→vidéo
       de 1rem, mesuré sur le bloc réel (16px). */
    #wt-2025 .wt-video-frame {
      position: relative;
      width: 100%;
      margin-top: 1rem;
      padding-top: 56.17021276595745%;
      overflow: hidden;
    }
    #wt-2025 .wt-video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    @media screen and (max-width: 479px) {
      #wt-2025 .wt-title { font-size: 2.5rem; line-height: 1; letter-spacing: -0.1rem; }
    }
    /* Emplacement vidéo : l'iframe est vide (about:blank), on voit ce fond. */
    #wt-2025 .wt-video-frame { background: linear-gradient(135deg, #002882, #2a4cff); }
    #wt-2025 .wt-video-frame::before { content: "Vidéo à venir"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.8); font-size: 0.875rem; font-weight: 600; }
  </style>

  <h2 class="wt-title" id="wt-2025-title">Lorem ipsum dolor sit<span class="wt-title-dot">.</span></h2>

  <!-- Vidéo : remplacer src="about:blank" par l'adresse d'intégration (ex. https://www.youtube.com/embed/ID) -->
  <div class="wt-video-frame">
    <iframe src="about:blank" title="Titre de la vidéo" loading="lazy" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
</section>
